# Publica la extensión en el Visual Studio Marketplace con Trusted Publishing (sin PAT).
# Se lanza al subir un tag vX.Y.Z (debe coincidir con "version" de package.json) o a mano.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx @vscode/vsce publish --oidc
